{% extends "base.html" %}
{% load static %}

{% block body %}
    <div class="container">
        </br>
        <form id="file_upload_form" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ file_upload_form }}
            <input type="submit" value="Submit">
        </form>
        </br>
        <a href="{{ tg_site  }}/stats"
           target="_blank" rel="noopener noreferrer">HTML Link</a>
        </br>
        <a href="{{ tg_site }}/api/competition/stats?competitionFeed=TEPL&seasonId={{ season }}&weekId={{ game_week }}"
           target="_blank" rel="noopener noreferrer">JSON link</a>
    </div> <!-- /container -->
{% endblock body %}
